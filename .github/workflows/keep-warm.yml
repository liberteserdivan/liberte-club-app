name: keep-warm

# Vercel Hobby lambda'larini sicak tut: bos kalip soguyan fonksiyonlari periyodik
# olarak uyandirir; boylece ilk ziyaretcinin soguk baslangic gecikmesi olmaz.
# Public repo => GitHub Actions dakikalari ucretsiz/sinirsiz.
# NOT: Zamanli is, repo 60 gun hic aktivite gormezse otomatik devre disi kalir.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Sunucuyu isit (health + auth + state DB havuzu)
        run: |
          curl -fsS --max-time 30 "https://app.liberte.cafe/api/health" -o /dev/null || true
          curl -fsS --max-time 30 "https://app.liberte.cafe/api/auth?action=warm" -o /dev/null || true
          curl -fsS --max-time 30 "https://app.liberte.cafe/api/state?warm=1" -o /dev/null || true