# Android P0 smoke — GitHub Actions emulator (BrowserStack yerine)
#
# Gerekli GitHub Secrets:
#   MOBILE_TEST_PHONE — test kullanici telefonu
#   MOBILE_TEST_PIN   — test kullanici PIN
#
# Manuel: Actions -> Android Mobile Smoke (Emulator) -> Run workflow

name: Android Mobile Smoke (Emulator)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'api/**'
      - 'e2e/mobile/**'
      - 'scripts/run-local-android-smoke.mjs'
      - 'scripts/verify-local-mobile-test-env.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-mobile-smoke-emulator.yml'

concurrency:
  group: android-mobile-smoke-emulator
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm install
        run: npm ci --legacy-peer-deps

      - name: Web build
        env:
          VITE_API_BASE_URL: https://liberte-club-app.vercel.app
        run: npm run build:release

      - name: Capacitor Android sync
        run: |
          node scripts/generate-android-icons.mjs
          npx cap sync android

      - name: Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Test secret kontrolu
        env:
          MOBILE_TEST_PHONE: ${{ secrets.MOBILE_TEST_PHONE }}
          MOBILE_TEST_PIN: ${{ secrets.MOBILE_TEST_PIN }}
        run: node scripts/verify-local-mobile-test-env.mjs


      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatorde P0 smoke
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBILE_TEST_PHONE: ${{ secrets.MOBILE_TEST_PHONE }}
          MOBILE_TEST_PIN: ${{ secrets.MOBILE_TEST_PIN }}
          MOBILE_SMOKE_P0_ONLY: 'true'
          MOBILE_ANDROID_APK_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
          VITE_API_BASE_URL: https://liberte-club-app.vercel.app
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/ci-android-emulator-smoke.sh
      - name: Rapor artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke-emulator
          path: |
            e2e/mobile/reports/*.json
            e2e/mobile/reports/*.log
            ci-logs/
            appium.log
          if-no-files-found: ignore