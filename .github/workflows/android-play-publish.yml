# Play Console'a AAB yukleme — manuel tetikleme

name: Android Play Publish

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Yayin kanali'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Secret kontrolu
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/verify-github-android-secrets.mjs

      - name: Android imza bilgileri
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          printf '%s\n' "$KEYSTORE_PROPERTIES" > android/keystore.properties
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/liberte-club-release-key.jks

      - name: Play Console kimlik bilgisi
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s\n' "$PLAY_JSON" > android/play-console-service-account.json

      - name: Imza dosyalarini dogrula
        run: |
          test -s android/app/liberte-club-release-key.jks || (echo "HATA: JKS bos — ANDROID_KEYSTORE_BASE64 yanlis kopyalanmis olabilir" && exit 1)
          test -s android/keystore.properties || (echo "HATA: keystore.properties bos" && exit 1)
          grep -q keyAlias android/keystore.properties || (echo "HATA: keystore.properties formati yanlis (4 satir olmali)" && exit 1)
          node -e "JSON.parse(require('fs').readFileSync('android/play-console-service-account.json','utf8'))" || (echo "HATA: PLAY_STORE_SERVICE_ACCOUNT_JSON gecerli JSON degil" && exit 1)
          echo "Imza dosyalari OK (JKS: $(wc -c < android/app/liberte-club-release-key.jks) byte)"

      - name: Bagimliliklari kur
        run: npm ci --legacy-peer-deps

      - name: Firebase config
        run: node scripts/materialize-firebase-native-config.mjs

      - name: Web build
        run: npm run build:release

      - name: Capacitor Android sync
        run: |
          node scripts/generate-android-icons.mjs
          npx cap sync android

      - name: AAB derle
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Play Console yukle
        working-directory: android
        run: ./gradlew publishReleaseBundle --track=${{ inputs.track }}
