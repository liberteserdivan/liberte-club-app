# Play Console'a AAB yukleme — manuel tetikleme
# Gerekli GitHub Secrets:
#   PLAY_STORE_SERVICE_ACCOUNT_JSON
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PROPERTIES
#   GOOGLE_SERVICE_INFO_PLIST
#   GOOGLE_SERVICES_JSON

name: Android Play Publish

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Yayin kanali'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Secret kontrolu
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/verify-github-android-secrets.mjs

      - name: Android imza bilgileri
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_PROPERTIES" > android/keystore.properties
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/liberte-club-release-key.jks

      - name: Play Console kimlik bilgisi
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_JSON" > android/play-console-service-account.json

      - name: Bagimliliklari kur
        run: npm ci --legacy-peer-deps

      - name: Derle ve yukle
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          CI: true
        run: node scripts/publish-android-play.mjs ${{ inputs.track }} --build
