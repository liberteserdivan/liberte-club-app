# Liberte Club " Codemagic iOS + Android maaza derlemesi
#
# Ortak Secure env: GOOGLE_SERVICE_INFO_PLIST, GOOGLE_SERVICES_JSON
# Android ek Secure: PLAY_STORE_SERVICE_ACCOUNT_JSON
# Android imza " iki yol:
#   A) Code signing ' Android keystore reference: liberte_club_release
#   B) Env: ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PROPERTIES
# Android Secure env (grup: liberte_android):
#   GOOGLE_SERVICES_JSON, PLAY_STORE_SERVICE_ACCOUNT_JSON
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PROPERTIES

workflows:
  ios-release:
    name: ios-release
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'cm-release'
          include: true
          source: true
    environment:
      groups:
        - app_store_connect
      ios_signing:
        provisioning_profiles:
          - liberte_app_store_profile
        certificates:
          - liberte_distribution
      vars:
        # initializing takilmasini azalt - kisa clone
        CM_CLONE_DEPTH: "20"
        IOS_RELEASE: "true"
        BUNDLE_ID: cafe.liberte.app
        APP_STORE_APP_NAME: Liberte Gastro Cafe
        APP_VERSION: "1.1.31"
        IOS_MIN_BUILD_NUMBER: "61"
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        # Native build'in vuracagi API koku - domain/Vercel URL degisiminde burayi guncelle
        VITE_API_BASE_URL: "https://app.liberte.cafe"
        # App Store post-processing: Apple isleme suresi 5-30+ dk surer; kisa timeout kirmizi build uretir
        APP_STORE_CONNECT_MAX_FIND_BUILD_WAIT: "20"
        APP_STORE_CONNECT_MAX_BUILD_PROCESSING_WAIT: "45"
      node: 22
      xcode: latest
    scripts:
      - name: Node ortami dogrula
        script: |
          node --version
          npm --version
      - name: npm install
        script: npm ci --legacy-peer-deps
      - name: Firebase config
        script: |
          node scripts/materialize-firebase-native-config.mjs
          test -f ios/App/App/GoogleService-Info.plist || (echo "HATA: GOOGLE_SERVICE_INFO_PLIST env ekle" && exit 1)
      - name: Web build
        script: |
          export VITE_APP_VERSION="${APP_VERSION:-1.1.31}.${BUILD_NUMBER:-0}"
          export VITE_BUILD_NUMBER="${BUILD_NUMBER:-0}"
          # Native API kk Vite build'e geer; ayarl deilse production fallback
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://app.liberte.cafe}"
          echo "[build] VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build:release
      - name: Capacitor iOS sync ve CocoaPods
        script: |
          node scripts/setup-ios-cocoapods.mjs
      - name: iOS surum ve build numarasi
        script: |
          set -eo pipefail
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"

          # Sayisal Apple ID'yi bundle id uzerinden coz " manuel deger gerekmez.
          # Kimlik bilgileri app_store_connect grubundan otomatik okunur.
          APPLE_ID="$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" \
            --strict-match-identifier \
            --json 2>/dev/null \
            | python3 -c "import sys,json; a=json.load(sys.stdin); print(a[0]['id'] if a else '')" \
            || echo '')"

          # TestFlight'taki en yuksek build numarasini al, +1 yap " cakismayi kesin onler.
          IOS_BUILD=""
          if [ -n "$APPLE_ID" ]; then
            LATEST="$(app-store-connect get-latest-testflight-build-number "$APPLE_ID" 2>/dev/null || echo '')"
            if [ -n "$LATEST" ]; then
              IOS_BUILD="$((LATEST + 1))"
            fi
          fi

          # Guvenli geri donus: App Store sorgusu basarisizsa taban (>60) + Codemagic sayaci.
          if [ -z "$IOS_BUILD" ]; then
            MIN_BUILD="${IOS_MIN_BUILD_NUMBER:-61}"
            if [ "${BUILD_NUMBER:-0}" -lt "$MIN_BUILD" ]; then
              IOS_BUILD="$MIN_BUILD"
            else
              IOS_BUILD="$BUILD_NUMBER"
            fi
          fi

          echo "iOS build number: $IOS_BUILD (AppleID=$APPLE_ID, TestFlight latest=$LATEST)"
          agvtool new-version -all "$IOS_BUILD"
      - name: Manuel imza dosyalarini Xcode projesine uygula
        script: xcode-project use-profiles
      - name: iOS archive (IPA)
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            || {
              echo "=== xcodebuild HATA satirlari ==="
              grep -i "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -40 || true
              tail -200 /tmp/xcodebuild_logs/*.log 2>/dev/null || true
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # IPA yuklendikten sonra TestFlight + App Store incelemesine gonder
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
        copyright: "2026 Liberte Gastro Cafe"

  android-release:
    name: android-release
    max_build_duration: 90
    # Mac kuyrugu initializing'de takiliyor - Android Linux'ta daha hizli baslar
    instance_type: linux
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'cm-release'
          include: true
          source: true
    environment:
      groups:
        - liberte_android
      vars:
        # initializing takilmasini azalt - kisa clone
        CM_CLONE_DEPTH: "20"
        ANDROID_RELEASE: "true"
        PLAY_TRACK: alpha
        ENABLE_PLAY_UPLOAD: "true"
        PACKAGE_NAME: cafe.liberte.app
        APP_VERSION: "1.1.31"
        ANDROID_MIN_VERSION_CODE: "96"
        PROMOTE_ALPHA_TO_INTERNAL: "true"
        # Native build'in vuracagi API koku - domain/Vercel URL degisiminde burayi guncelle
        VITE_API_BASE_URL: "https://app.liberte.cafe"
      node: 22
      java: 21
    scripts:
      - name: Node ortami dogrula
        script: |
          node --version
          npm --version
      - name: npm install
        script: npm ci --legacy-peer-deps
      - name: Android ortam kontrolu
        script: node scripts/verify-codemagic-android-env.mjs
      - name: Firebase, imza ve Play kimlik
        script: |
          node scripts/materialize-firebase-native-config.mjs
          node scripts/setup-codemagic-android-signing.mjs
          node scripts/setup-codemagic-play-credentials.mjs
          test -f android/app/google-services.json || (echo "HATA: GOOGLE_SERVICES_JSON env ekle" && exit 1)
          test -f android/keystore.properties || (echo "HATA: Android imza ayari eksik" && exit 1)
      - name: Web build
        script: |
          export VITE_APP_VERSION="${APP_VERSION:-1.1.31}.${BUILD_NUMBER:-0}"
          # Native API kk Vite build'e geer; ayarl deilse production fallback
          export VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://app.liberte.cafe}"
          echo "[build] VITE_APP_VERSION=$VITE_APP_VERSION VITE_API_BASE_URL=$VITE_API_BASE_URL commit=$(git rev-parse --short HEAD)"
          npm run build:release
      - name: Capacitor Android sync
        script: |
          node scripts/generate-android-icons.mjs
          npx cap sync android
      - name: Android surum kodu
        script: |
          set -eo pipefail
          # Google Play'deki en yuksek versionCode'u al, +1 yap " cakismayi kesin onler.
          # Kimlik: bir onceki adimda yazilan servis hesabi JSON dosyasi.
          CREDS="$CM_BUILD_DIR/android/play-console-service-account.json"
          LATEST="$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --credentials "@file:$CREDS" 2>/dev/null || echo '')"
          if [ -n "$LATEST" ]; then
            export ANDROID_VERSION_CODE="$((LATEST + 1))"
            echo "[android-version] Play latest=$LATEST -> versionCode=$ANDROID_VERSION_CODE"
          else
            echo "[android-version] Play sorgusu basarisiz " taban/BUILD_NUMBER kullanilacak"
          fi
          node scripts/set-android-version-code.mjs
      - name: Derleme dogrulama
        script: |
          echo "[verify] commit=$(git rev-parse --short HEAD)"
          grep -E 'versionCode|versionName' android/app/build.gradle
          node scripts/verify-android-dist.mjs
      - name: AAB derle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Play Console yukle
        script: |
          set -eo pipefail
          if [ "${ENABLE_PLAY_UPLOAD:-false}" != "true" ]; then
            echo "[play] Upload atlandi " ENABLE_PLAY_UPLOAD=true olmadan Play'e yuklenmez"
            exit 0
          fi
          cd android
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "[play] HATA: AAB bulunamadi " once bundleRelease basarili olmali"
            exit 1
          fi
          TRACK="${PLAY_TRACK:-alpha}"
          echo "[play] AAB hazir: $AAB_PATH ($(du -h "$AAB_PATH" | cut -f1))"
          echo "[play] track=$TRACK version=$APP_VERSION"
          # Basarisiz yukleme build'i yesil gostermesin
          ./gradlew publishReleaseBundle --track="$TRACK"
          echo "[play] Otomatik yukleme tamamlandi: $TRACK"
          if [ "$TRACK" = "production" ]; then
            cd "$CM_BUILD_DIR"
            node scripts/rollout-play-production.mjs || echo "[play] production rollout atlandi (draft veya izin)"
          fi
          # Dahili test kanalini da ayni surume cek (testerlar geride kalmasin)
          if [ "$TRACK" = "alpha" ] && [ "${PROMOTE_ALPHA_TO_INTERNAL:-true}" = "true" ]; then
            cd "$CM_BUILD_DIR"
            node scripts/promote-play-alpha-to-internal.mjs
          fi
          node scripts/verify-play-console.mjs
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true

