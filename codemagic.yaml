# Liberte Club — Capacitor iOS App Store / TestFlight derlemesi
# Codemagic UI → Environment variable groups:
#   app_store_credentials:
#     APP_STORE_CONNECT_ISSUER_ID
#     APP_STORE_CONNECT_KEY_IDENTIFIER
#     APP_STORE_CONNECT_PRIVATE_KEY  (.p8 dosyasinin tam icerigi)
#   certificate_credentials (yeni sertifika olusturma icin):
#     CERTIFICATE_PRIVATE_KEY  (openssl genrsa 2048 ile uretilen RSA anahtar)

workflows:
  ios-release:
    name: ios-release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
        - certificate_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cafe.liberte.app
      vars:
        BUNDLE_ID: cafe.liberte.app
        APP_STORE_APP_NAME: Liberte Gastro Cafe
        APP_VERSION: "1.0.0"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 20
      xcode: latest
    scripts:
      - name: npm install
        script: npm install
      - name: npm run build
        script: npm run build
      - name: Capacitor iOS sync
        script: npx cap sync ios
      - name: Keychain hazirla
        script: keychain initialize
      - name: App Store imza dosyalarini al veya olustur
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Sertifikalari keychain'e ekle
        script: keychain add-certificates
      - name: Xcode provisioning profile ayarlari
        script: xcode-project use-profiles
      - name: iOS surum ve build numarasi
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: iOS archive (IPA)
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
