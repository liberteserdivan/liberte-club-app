# Liberte Club — Codemagic iOS + Android mağaza derlemesi
#
# Ortak Secure env: GOOGLE_SERVICE_INFO_PLIST, GOOGLE_SERVICES_JSON
# Android ek Secure: PLAY_STORE_SERVICE_ACCOUNT_JSON
# Android imza — iki yol:
#   A) Code signing → Android keystore reference: liberte_club_release
#   B) Env: ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PROPERTIES
# Android Secure env (grup: liberte_android):
#   GOOGLE_SERVICES_JSON, PLAY_STORE_SERVICE_ACCOUNT_JSON
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PROPERTIES

workflows:
  ios-release:
    name: ios-release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      ios_signing:
        provisioning_profiles:
          - liberte_app_store_profile
        certificates:
          - liberte_distribution
      vars:
        IOS_RELEASE: "true"
        BUNDLE_ID: cafe.liberte.app
        APP_STORE_APP_NAME: Liberte Gastro Cafe
        APP_VERSION: "1.1.6"
        IOS_MIN_BUILD_NUMBER: "32"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Node.js 22 hazirla
        script: |
          nvm install 22
          nvm use 22
          node -v
          npm -v
      - name: npm install
        script: npm install --legacy-peer-deps
      - name: Firebase config
        script: |
          node scripts/materialize-firebase-native-config.mjs
          test -f ios/App/App/GoogleService-Info.plist || (echo "HATA: GOOGLE_SERVICE_INFO_PLIST env ekle" && exit 1)
      - name: Web build
        script: npm run build:release
      - name: Capacitor iOS sync
        script: |
          npx cap sync ios
          node scripts/fix-ios-spm-paths.mjs
      - name: iOS surum ve build numarasi
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          MIN_BUILD="${IOS_MIN_BUILD_NUMBER:-25}"
          if [ "${BUILD_NUMBER:-0}" -lt "$MIN_BUILD" ]; then
            IOS_BUILD="$MIN_BUILD"
          else
            IOS_BUILD="$BUILD_NUMBER"
          fi
          echo "iOS build number: $IOS_BUILD (Codemagic BUILD_NUMBER=$BUILD_NUMBER, min=$MIN_BUILD)"
          agvtool new-version -all "$IOS_BUILD"
      - name: Manuel imza dosyalarini Xcode projesine uygula
        script: xcode-project use-profiles
      - name: iOS archive (IPA)
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            || {
              echo "=== xcodebuild HATA satirlari ==="
              grep -i "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -40 || true
              tail -200 /tmp/xcodebuild_logs/*.log 2>/dev/null || true
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: android-release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        - liberte_android
      vars:
        ANDROID_RELEASE: "true"
        PLAY_TRACK: internal
        PACKAGE_NAME: cafe.liberte.app
        APP_VERSION: "1.1.6"
        ANDROID_MIN_VERSION_CODE: "32"
      node: 22
      java: 21
    scripts:
      - name: Node.js 22 hazirla
        script: |
          nvm install 22
          nvm use 22
          node -v
          npm -v
      - name: npm install
        script: npm install --legacy-peer-deps
      - name: Android ortam kontrolu
        script: node scripts/verify-codemagic-android-env.mjs
      - name: Firebase, imza ve Play kimlik
        script: |
          node scripts/materialize-firebase-native-config.mjs
          node scripts/setup-codemagic-android-signing.mjs
          node scripts/setup-codemagic-play-credentials.mjs
          test -f android/app/google-services.json || (echo "HATA: GOOGLE_SERVICES_JSON env ekle" && exit 1)
          test -f android/keystore.properties || (echo "HATA: Android imza ayari eksik" && exit 1)
      - name: Web build
        script: |
          export VITE_APP_VERSION="${APP_VERSION:-1.1.2}.${BUILD_NUMBER:-0}"
          echo "[build] VITE_APP_VERSION=$VITE_APP_VERSION commit=$(git rev-parse --short HEAD)"
          npm run build:release
      - name: Capacitor Android sync
        script: |
          node scripts/generate-android-icons.mjs
          npx cap sync android
      - name: Android surum kodu
        script: node scripts/set-android-version-code.mjs
      - name: Derleme dogrulama
        script: |
          echo "[verify] commit=$(git rev-parse --short HEAD)"
          grep -E 'versionCode|versionName' android/app/build.gradle
          grep -R "Ayarları Aç" dist/assets/*.js >/dev/null || (echo "HATA: yeni bildirim UI dist icinde yok" && exit 1)
          echo "[verify] yeni bildirim UI dist icinde bulundu"
      - name: AAB derle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Play Console yukle
        script: |
          cd android
          ./gradlew publishReleaseBundle --track="$PLAY_TRACK"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
