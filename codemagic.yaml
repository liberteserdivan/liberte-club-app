# Liberte Club — Codemagic iOS + Android mağaza derlemesi
#
# iOS — Environment variable group: app_store_connect
#   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY
# iOS + Android ortak (Secure):
#   GOOGLE_SERVICE_INFO_PLIST, GOOGLE_SERVICES_JSON
# Android ek (Secure):
#   PLAY_STORE_SERVICE_ACCOUNT_JSON — Play Console servis hesabi JSON
# Android — Code signing identities:
#   Keystore reference: liberte_club_release  (.jks + alias + sifreler)
# iOS — Code signing identities:
#   liberte_distribution, liberte_app_store_profile

workflows:
  ios-release:
    name: ios-release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      ios_signing:
        provisioning_profiles:
          - liberte_app_store_profile
        certificates:
          - liberte_distribution
      vars:
        BUNDLE_ID: cafe.liberte.app
        APP_STORE_APP_NAME: Liberte Gastro Cafe
        APP_VERSION: "1.1.1"
        IOS_MIN_BUILD_NUMBER: "24"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Node.js 22 hazirla
        script: |
          nvm install 22
          nvm use 22
          node -v
          npm -v
      - name: npm install
        script: npm install --legacy-peer-deps
      - name: npm run build
        script: npm run build
      - name: Capacitor iOS sync
        script: npx cap sync ios
      - name: Firebase plist ve SPM yollari
        script: |
          node scripts/materialize-firebase-native-config.mjs
          node scripts/fix-ios-spm-paths.mjs
          test -f ios/App/App/GoogleService-Info.plist || (echo "HATA: GoogleService-Info.plist yok — Codemagic GOOGLE_SERVICE_INFO_PLIST env ekle" && exit 1)
          grep -n "node_modules" ios/App/CapApp-SPM/Package.swift
      - name: iOS surum ve build numarasi
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          MIN_BUILD="${IOS_MIN_BUILD_NUMBER:-23}"
          if [ "${BUILD_NUMBER:-0}" -lt "$MIN_BUILD" ]; then
            IOS_BUILD="$MIN_BUILD"
          else
            IOS_BUILD="$BUILD_NUMBER"
          fi
          echo "iOS build number: $IOS_BUILD (Codemagic BUILD_NUMBER=$BUILD_NUMBER, min=$MIN_BUILD)"
          agvtool new-version -all "$IOS_BUILD"
      - name: Manuel imza dosyalarini Xcode projesine uygula
        script: xcode-project use-profiles
      - name: Imza ayarlarini dogrula
        script: |
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings \
            | grep -E 'PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CURRENT_PROJECT_VERSION|CODE_SIGN_ENTITLEMENTS' \
            | head -25
          echo "=== App.entitlements ==="
          cat ios/App/App/App.entitlements
      - name: iOS archive (IPA)
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            || {
              echo "=== xcodebuild HATA satirlari ==="
              grep -i "error:" /tmp/xcodebuild_logs/*.log 2>/dev/null | tail -40 || true
              echo "=== xcodebuild log (son 200 satir) ==="
              tail -200 /tmp/xcodebuild_logs/*.log 2>/dev/null || true
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  android-release:
    name: android-release
    max_build_duration: 90
    instance_type: linux_x2
    environment:
      android_signing:
        - liberte_club_release
      vars:
        PLAY_TRACK: internal
        PACKAGE_NAME: cafe.liberte.app
      node: 22
      java: 21
    scripts:
      - name: Node.js 22 hazirla
        script: |
          nvm install 22
          nvm use 22
          node -v
          npm -v
      - name: npm install
        script: npm install --legacy-peer-deps
      - name: Firebase, imza ve Play kimlik
        script: |
          node scripts/materialize-firebase-native-config.mjs
          node scripts/setup-codemagic-android-signing.mjs
          node scripts/setup-codemagic-play-credentials.mjs
          test -f android/app/google-services.json || (echo "HATA: GOOGLE_SERVICES_JSON env ekle" && exit 1)
      - name: Web build
        script: npm run build:release
      - name: Capacitor Android sync
        script: |
          node scripts/generate-android-icons.mjs
          npx cap sync android
      - name: AAB derle ve Play Console yukle
        script: |
          cd android
          ./gradlew bundleRelease
          cd ..
          node scripts/publish-android-play.mjs "$PLAY_TRACK"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
