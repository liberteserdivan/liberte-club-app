# Liberte Club — Capacitor iOS App Store / TestFlight derlemesi
# Codemagic UI → Environment variable group: app_store_connect
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_KEY_IDENTIFIER
#   APP_STORE_CONNECT_PRIVATE_KEY
#
# Codemagic UI → Code signing identities (manuel yukleme):
#   Certificate reference: liberte_distribution  (.p12 + private key)
#   Provisioning profile reference: liberte_app_store_profile
#   NOT: Profile Push Notifications capability icermeli (aps-environment).
#   Apple Developer → Identifiers → cafe.liberte.app → Push Notifications acik olmali.
#
# fetch-signing-files kullanilmiyor — private key olmadan sertifika kaydedemez.

workflows:
  ios-release:
    name: ios-release
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      ios_signing:
        provisioning_profiles:
          - liberte_app_store_profile
        certificates:
          - liberte_distribution
      vars:
        BUNDLE_ID: cafe.liberte.app
        APP_STORE_APP_NAME: Liberte Gastro Cafe
        APP_VERSION: "1.1"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Node.js 22 hazirla
        script: |
          nvm install 22
          nvm use 22
          node -v
          npm -v
      - name: npm install
        script: npm install
      - name: npm run build
        script: npm run build
      - name: Capacitor iOS sync
        script: npx cap sync ios
      - name: SPM yollarini macOS uyumlu yap
        script: |
          sed -i '' 's/\\/\//g' ios/App/CapApp-SPM/Package.swift 2>/dev/null || \
          sed -i 's/\\/\//g' ios/App/CapApp-SPM/Package.swift
          grep -n "node_modules" ios/App/CapApp-SPM/Package.swift
      - name: iOS surum ve build numarasi
        script: |
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Manuel imza dosyalarini Xcode projesine uygula
        script: xcode-project use-profiles
      - name: Imza ayarlarini dogrula
        script: |
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -showBuildSettings \
            | grep -E 'PROVISIONING_PROFILE|CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM' \
            | head -20
      - name: iOS archive (IPA)
        script: |
          set -eo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            || {
              echo "=== xcodebuild log (son 150 satir) ==="
              tail -150 /tmp/xcodebuild_logs/*.log 2>/dev/null || true
              exit 1
            }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - liberteserdivan@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
